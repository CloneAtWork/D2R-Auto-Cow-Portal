name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Build plugin, probe and release archives
        run: |
          ./build.sh probe
          ./build.sh package

      - name: Check DLL exports and imports
        run: |
          python3 -m pip install --quiet pefile
          python3 - <<'EOF'
          import pefile
          pe = pefile.PE("build/cow-portal-in-town.dll")
          exports = sorted(e.name.decode() for e in pe.DIRECTORY_ENTRY_EXPORT.symbols)
          imports = sorted(d.dll.decode() for d in pe.DIRECTORY_ENTRY_IMPORT)
          print("exports:", exports, "imports:", imports)
          assert exports == ["D2RLoaderGetPluginInfo", "D2RLoaderLoadPlugin", "D2RLoaderUnloadPlugin"]
          assert imports == ["KERNEL32.dll", "msvcrt.dll"]
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: cow-portal-in-town
          path: |
            dist/*
            build/cowportal-probe.dll

  # The behavioural test suite (tests/run_tests.sh) needs a runtime dump of the game,
  # which cannot be published; run it locally (see docs/BUILDING.md).
